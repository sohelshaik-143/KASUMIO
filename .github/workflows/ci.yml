name: KASUMIO Quality Gates & Verification CI

on:
  push:
    branches: [ main, 'feature/**', 'audit/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Compilation & Test Suite (Java 21 / Spring Boot 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Compile and Run Backend Tests
        working-directory: backend
        run: ./mvnw clean test -B

      - name: Package Backend Artifact
        working-directory: backend
        run: ./mvnw package -DskipTests -B

  frontend-quality-gate:
    name: Frontend Quality & Production Build (React 18 / Vite 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build
