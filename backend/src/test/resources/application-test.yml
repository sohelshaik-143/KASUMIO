server:
  port: 0

spring:
  application:
    name: kasumio-backend-test

  datasource:
    url: jdbc:h2:mem:kasumio_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

  flyway:
    enabled: false

kasumio:
  jwt:
    secret: kasumio_test_secret_key_with_at_least_256_bits_for_unit_and_integration_tests_123456
    expiration-ms: 3600000
