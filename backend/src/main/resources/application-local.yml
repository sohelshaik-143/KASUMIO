spring:
  datasource:
    url: jdbc:h2:mem:kasumio_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      data-locations: classpath:data-local.sql

  flyway:
    enabled: false

kasumio:
  jwt:
    secret: kasumio_super_secure_jwt_secret_key_with_at_least_256_bits_length_123456
    expiration-ms: 86400000
