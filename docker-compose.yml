version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kasumio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: kasumio_db
      MYSQL_USER: kasumio_user
      MYSQL_PASSWORD: kasumio_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kasumio_user", "-pkasumio_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
